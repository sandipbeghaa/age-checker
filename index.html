<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Checker</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <div class="checker">
        <h1>Age Eligibility Checker</h1>
        <div class="checkage">
            <label for="input-number">Enter your age:</label>
            <input type="number" class="numberbox" id="input-number" placeholder="e.g. 20"/>
        </div>
        <button id="check-age-btn">Check Age</button>
        <p id="result-display" class="result"></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
